
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four Digital Frames</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 10px;
  background: #080e1c;
  font-family: Arial, sans-serif;
}

.container {
  width: 100%;
  max-width: 1200px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.frame {
  width: 100%;
  overflow: hidden;
  border: 2px solid #263b5d;
  border-radius: 9px;
  background: #fff;
}

.frame iframe {
  display: block;
  width: 100%;
  border: 0;
}

/* Different heights */
.frame1 iframe { height: 330px; }
.frame2 iframe { height: 290px; }
.frame3 iframe { height: 350px; }
.frame4 iframe { height: 310px; }

@media(max-width:650px) {
  .container {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- Open immediately -->

  <div class="frame frame1">
    <iframe src="https://lltrco.com/?r=mmyy2"></iframe>
  </div>

  <div class="frame frame2">
    <iframe src="https://ggfdfgfr7-hue.github.io/Mmyy/"></iframe>
  </div>

  <!-- Open after 3 seconds -->

  <div class="frame frame3">
    <iframe data-src="https://lltrco.com/?r=mmyy11"></iframe>
  </div>

  <div class="frame frame4">
    <iframe data-src="https://ggfdfgfr7-hue.github.io/mmyygg/"></iframe>
  </div>

</div>

<script>
setTimeout(function() {
  document.querySelectorAll("iframe[data-src]").forEach(function(frame) {
    frame.src = frame.dataset.src;
  });
}, 3000);
</script>

</body>
</html>
