
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Single Frame</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
padding:10px;
background:#080e1c;
}
.frame{
width:100%;
height:95vh;
border:2px solid #263b5d;
border-radius:12px;
overflow:hidden;
}
iframe{
width:100%;
height:100%;
border:0;
display:block;
}
</style>
</head>
<body>
<div class="frame">
<iframe src="https://lltrco.com/?r=mahmoudyoussef20"></iframe>
</div>
</body>
</html>
